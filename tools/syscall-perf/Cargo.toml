[workspace]

[package]
name = "solfuzz-syscall-perf"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
prost = "0.14.4"
protosol = { version = "=17.0.0", features = ["solana-types"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
openssl = "0.10"
bincode = "1.3.3"
solana-pubkey = "=4.3.0"
solana-rent = { version = "=4.4.0", features = ["serde"] }
solana-sdk-ids = "=3.1.0"
agave-feature-set = { git = "https://github.com/firedancer-io/agave", rev = "b0fcf42fde4900c3d5d3d709672d561d4106ab01", version = "=4.3.0", features = ["agave-unstable-api"] }
solana-program-runtime = { git = "https://github.com/firedancer-io/agave", rev = "b0fcf42fde4900c3d5d3d709672d561d4106ab01", version = "=4.3.0", features = ["agave-unstable-api", "dev-context-only-utils"] }
solana-svm = { git = "https://github.com/firedancer-io/agave", rev = "b0fcf42fde4900c3d5d3d709672d561d4106ab01", version = "=4.3.0", features = ["agave-unstable-api", "conformance"] }

[dev-dependencies]
solana-svm-conformance = { git = "https://github.com/firedancer-io/agave", rev = "b0fcf42fde4900c3d5d3d709672d561d4106ab01", version = "=4.3.0", default-features = false, features = ["ffi"] }

[profile.release]
lto = "thin"
